services:
  postgres:
    image: postgres:16
    container_name: patriot-finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: patriot_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Seoul
    ports:
      - '5432:5432'
    volumes:
      - patriot-finance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d patriot_finance']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  patriot-finance-postgres-data:
